steps:
  # FC-032 Change 5 (CI test gate): install + test the backend BEFORE
  # building the image. A broken test suite no longer deploys to prod.
  # Cloud Build steps are sequential; a non-zero exit here aborts the
  # pipeline and the previous Cloud Run revision keeps serving (combined
  # with FC-032's cloud-build-failure alert, the team learns about the
  # break within minutes instead of at the next merge).
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['ci']
    dir: 'backend'
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['test']
    dir: 'backend'

  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/storybook-api:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/storybook-api:latest'
      - './backend'

  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/storybook-api'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'storybook-api'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/storybook-api:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # FC-019 review fix HIGH-2: pin request timeout. Story generation already
      # runs up to ~5 min (FC-013/12/15 pipeline); the FC-019 spike route can
      # take ~3-6 min (2× sequential image-gen pass). Cloud Run's default
      # timeout is 300s. Without --timeout pinned, a fresh deploy that
      # creates the service would inherit the 300s default and break both
      # production story-gen and the spike route. 3600s = 60 min upper bound.
      - '--timeout=3600'
      # FC-025 (concurrency math, post-Phase-1 OOM investigation): each story
      # peaks at ~321 MB; pack at most 4 concurrent stories per instance at
      # 2 GiB to stay at ~63% utilization. Without these pinned, next deploy
      # silently regresses to defaults (concurrency=80, memory=512Mi) and a
      # multi-user burst OOMs the container.
      - '--memory=2048Mi'
      - '--concurrency=4'
      # FC-017 Phase 3 (PR #29 BLOCKER-1): the route returns 202 and the
      # worker continues running after res.send(). With CPU throttling on
      # (the Cloud Run default), the background worker freezes at every
      # await between Gemini calls; heartbeats arrive late, claimLock
      # judges them stale, another worker takes over and duplicates work.
      # --no-cpu-throttling pins CPU always allocated; required for the
      # FC-017 fire-and-forget pattern to work at all.
      - '--no-cpu-throttling'
      # FC-032 Change 2 (B-2): pin max-instances. Previously this was set
      # via a manual `gcloud run services update` annotation; the next
      # deploy that touched scaling silently regressed to default 1000.
      # At concurrency=4, 1000 instances × 4 = 4000 concurrent stories, an
      # unbounded Gemini bill under a marketing-burst load. 20 is the
      # engineered ceiling for current scale; raise deliberately via a
      # plan-file change.
      - '--max-instances=20'
      - '--min-instances=0'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/storybook-api:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/storybook-api:latest'
